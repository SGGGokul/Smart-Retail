name: Docker Build Validation

on:
  workflow_call:
  workflow_dispatch:

jobs:
  docker-build:
    name: Build & Validate Container Images
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config --quiet
          echo "docker-compose.yml configuration syntax is valid."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: retailiq-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./Frontend
          file: ./Frontend/Dockerfile
          push: false
          load: true
          tags: retailiq-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Verify Built Images Exist
        run: |
          docker image inspect retailiq-backend:${{ github.sha }} > /dev/null
          docker image inspect retailiq-frontend:${{ github.sha }} > /dev/null
          echo "Both container images built and verified locally."
