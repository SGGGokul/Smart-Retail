name: Database & Cache Integration

on:
  workflow_call:
  workflow_dispatch:

jobs:
  db-integration:
    name: PostgreSQL 17 & Redis 7 Integration
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: retailiq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies for OpenCV and video
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0 libgomp1 ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Verify PostgreSQL connectivity and extensions
        env:
          PGPASSWORD: password
        run: |
          psql -h localhost -U postgres -d retailiq_test -c "CREATE EXTENSION IF NOT EXISTS vector;"
          psql -h localhost -U postgres -d retailiq_test -c "SELECT version();"

      - name: Run Alembic migrations (upgrade head)
        env:
          DATABASE_URL: "postgresql+asyncpg://postgres:password@localhost:5432/retailiq_test"
        run: |
          alembic upgrade head

      - name: Run Database integration and contract tests
        env:
          DATABASE_URL: "postgresql+asyncpg://postgres:password@localhost:5432/retailiq_test"
          RATE_LIMIT_REDIS_URL: "redis://localhost:6379/1"
          RATE_LIMIT_ENABLED: "true"
          PYTHONPATH: "."
        run: |
          python -m pytest tests/test_shelves.py tests/test_health.py -v
