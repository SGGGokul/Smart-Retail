name: Backend CI

on:
  workflow_call:
  workflow_dispatch:

jobs:
  backend-tests:
    name: Backend Tests & Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies for OpenCV and video
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0 libgomp1 ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio flake8

      - name: Lint and syntax verification
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=Frontend,.venv
          # Warning level checks
          flake8 . --count --exit-zero --max-complexity=15 --max-line-length=120 --statistics --exclude=Frontend,.venv

      - name: Run Backend Unit & Intelligence Tests
        env:
          RATE_LIMIT_ENABLED: "false"
          PYTHONPATH: "."
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
        run: |
          python -m pytest tests/test_retail_intelligence.py tests/test_visit_service.py tests/test_zone_service.py -v
